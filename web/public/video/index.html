<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#000000" />
  <title>Radio Crestin: what's new</title>
  <link rel="icon" href="/favicon/favicon.ico" />
  <!--
    Plays a release's narrated video ("What's new") full-window. GitHub serves release files as
    downloads, so release notes link here instead: /video/?tag=v1.6.2 plays
    https://github.com/radio-crestin/radiocrestin.ro/releases/download/v1.6.2/radio-crestin-whats-new.mp4
  -->
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
    video { display: block; width: 100vw; height: 100vh; height: 100dvh; object-fit: contain; background: #000; }
    .sound { position: fixed; top: max(16px, env(safe-area-inset-top)); right: 16px; display: none;
      align-items: center; gap: 8px; padding: 10px 16px; border: 0; border-radius: 999px;
      background: rgba(255, 255, 255, 0.92); color: #111; font: 600 16px/1 inherit; cursor: pointer;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.4); }
    .sound.shown { display: inline-flex; }
    .sound svg { width: 20px; height: 20px; }
    .missing { display: grid; place-items: center; height: 100%; padding: 16px; text-align: center; }
    .missing a { color: #ff5c93; }
  </style>
</head>
<body>
  <video id="video" controls playsinline preload="auto"></video>
  <button class="sound" id="sound" type="button" aria-label="Turn the sound on">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
      stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z" />
      <path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14" /></svg>
    Sound on
  </button>
  <script>
    (() => {
      const RELEASES = "https://github.com/radio-crestin/radiocrestin.ro/releases";
      const tag = new URLSearchParams(location.search).get("tag") || "";
      const video = document.getElementById("video");
      const sound = document.getElementById("sound");

      if (!/^(mobile\/)?v\d+\.\d+\.\d+$/.test(tag)) {
        video.remove();
        document.body.innerHTML =
          `<p class="missing">No video picked. <a href="${RELEASES}">See every release</a></p>`;
        return;
      }

      const base = `${RELEASES}/download/${tag}/radio-crestin-whats-new`;
      document.title = `Radio Crestin ${tag.replace("mobile/", "")}: what's new`;
      video.poster = `${base}.jpg`;
      video.src = `${base}.mp4`;

      const fullscreen = () => {
        if (document.fullscreenElement || !document.documentElement.requestFullscreen) return;
        document.documentElement.requestFullscreen().catch(() => {});
      };
      const unmute = () => {
        video.muted = false;
        sound.classList.remove("shown");
        fullscreen();
        // The same tap may reach the video's own play/pause toggle: play again once it has.
        setTimeout(() => video.play().catch(() => {}), 100);
      };

      // Browsers allow autoplay with sound only after a visit's first tap: start muted if refused,
      // and turn the sound on (and go fullscreen) at the first tap anywhere.
      video.play().catch(() => {
        video.muted = true;
        sound.classList.add("shown");
        video.play().catch(() => {});
      });
      sound.addEventListener("click", unmute);
      document.addEventListener("pointerdown", (event) => {
        if (event.target !== sound && video.muted) unmute();
      }, { once: true });
      video.addEventListener("dblclick", fullscreen);
      document.addEventListener("keydown", (event) => {
        if (event.key === "f") fullscreen();
      });
    })();
  </script>
</body>
</html>
