<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1418"/><stop offset="1" stop-color="#121216"/>
    </linearGradient>
    <linearGradient id="be" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a3063d"/><stop offset="1" stop-color="#7a002b"/>
    </linearGradient>
    <linearGradient id="cl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2387a"/><stop offset="1" stop-color="#d81b60"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <marker id="aA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff5c93"/></marker>
    <marker id="aD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4fc3f7"/></marker>
    <marker id="aL" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b9b9c6"/></marker>
  </defs>

  <rect width="1200" height="680" rx="28" fill="url(#bg)"/>

  <!-- groups -->
  <rect x="262" y="56" width="300" height="548" rx="24" fill="#8f0133" fill-opacity="0.14" stroke="#c2185b" stroke-opacity="0.7" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="284" y="88" font-size="18" font-weight="700" fill="#ff8ab3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">backend/</text>
  <rect x="622" y="196" width="380" height="268" rx="24" fill="#e91e63" fill-opacity="0.08" stroke="#f06292" stroke-opacity="0.7" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="644" y="228" font-size="18" font-weight="700" fill="#ff8ab3">Where people listen</text>

  <!-- arrows: none cross -->
  <g fill="none" stroke-width="4" stroke-linecap="round">
    <path d="M222,306 C248,306 248,196 276,196" stroke="#ff5c93" marker-end="url(#aA)"/>
    <path d="M222,374 C248,374 248,484 276,484" stroke="#4fc3f7" stroke-dasharray="9 8" marker-end="url(#aD)"/>
    <path d="M542,196 C592,196 590,300 618,300" stroke="#ff5c93" marker-end="url(#aA)"/>
    <path d="M542,484 C592,484 590,380 618,380" stroke="#4fc3f7" stroke-dasharray="9 8" marker-end="url(#aD)"/>
    <path d="M1002,340 L1036,340" stroke="#b9b9c6" marker-end="url(#aL)"/>
  </g>
  <text x="200" y="462" font-size="15" fill="#4fc3f7" font-weight="600" text-anchor="middle">song</text>
  <text x="200" y="481" font-size="15" fill="#4fc3f7" font-weight="600" text-anchor="middle">titles</text>

  <!-- stations -->
  <g filter="url(#sh)"><rect x="28" y="256" width="194" height="168" rx="22" fill="#26262e" stroke="#3d3d48" stroke-width="1.5"/></g>
  <text x="125" y="330" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">Radio stations</text>
  <text x="125" y="362" font-size="17" fill="#a9a9b6" text-anchor="middle">60+ live streams</text>

  <!-- streaming -->
  <g filter="url(#sh)"><rect x="282" y="112" width="260" height="168" rx="20" fill="url(#be)"/></g>
  <text x="412" y="172" font-size="25" font-weight="700" fill="#fff" text-anchor="middle">Streaming</text>
  <text x="412" y="202" font-size="15" fill="#ffc1d6" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">backend/streaming</text>
  <text x="412" y="236" font-size="17" fill="#ffe3ec" text-anchor="middle">re-streams each station</text>
  <text x="412" y="259" font-size="17" fill="#ffe3ec" text-anchor="middle">as HLS</text>

  <!-- api -->
  <g filter="url(#sh)"><rect x="282" y="390" width="260" height="188" rx="20" fill="url(#be)"/></g>
  <text x="412" y="450" font-size="25" font-weight="700" fill="#fff" text-anchor="middle">API + admin</text>
  <text x="412" y="480" font-size="15" fill="#ffc1d6" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">backend/api</text>
  <text x="412" y="514" font-size="17" fill="#ffe3ec" text-anchor="middle">stations · song on air</text>
  <text x="412" y="538" font-size="17" fill="#ffe3ec" text-anchor="middle">listeners · reviews</text>

  <!-- website and app -->
  <g filter="url(#sh)"><rect x="642" y="250" width="160" height="186" rx="20" fill="url(#cl)"/></g>
  <text x="722" y="314" font-size="25" font-weight="700" fill="#fff" text-anchor="middle">Website</text>
  <text x="722" y="344" font-size="15" fill="#ffe0ea" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">web/</text>
  <text x="722" y="380" font-size="16" fill="#fff" text-anchor="middle">radiocrestin.ro</text>

  <g filter="url(#sh)"><rect x="822" y="250" width="160" height="186" rx="20" fill="url(#cl)"/></g>
  <text x="902" y="314" font-size="25" font-weight="700" fill="#fff" text-anchor="middle">App</text>
  <text x="902" y="344" font-size="15" fill="#ffe0ea" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">mobile/</text>
  <text x="902" y="380" font-size="16" fill="#fff" text-anchor="middle">phone · car · TV</text>

  <!-- listeners -->
  <g filter="url(#sh)"><rect x="1042" y="264" width="134" height="152" rx="22" fill="#fce4ec"/></g>
  <text x="1109" y="336" font-size="22" font-weight="700" fill="#5a0a26" text-anchor="middle">Listeners</text>
  <text x="1109" y="364" font-size="16" fill="#8f0133" text-anchor="middle">tap and play</text>

  <!-- legend -->
  <g font-size="17" fill="#d6d6e0">
    <line x1="300" y1="644" x2="350" y2="644" stroke="#ff5c93" stroke-width="4" stroke-linecap="round"/>
    <text x="362" y="650">audio, as HLS</text>
    <line x1="530" y1="644" x2="580" y2="644" stroke="#4fc3f7" stroke-width="4" stroke-dasharray="9 8" stroke-linecap="round"/>
    <text x="592" y="650">data, from <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#4fc3f7">api.radiocrestin.ro</tspan></text>
  </g>
</svg>
