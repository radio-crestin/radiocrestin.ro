# One version for the whole repository: pushing a vX.Y.Z tag (`make release` at the root) creates
# the GitHub release "vX.Y.Z" as a prerelease. Its notes have one section per app
# (mobile/, web/, backend/): what changed in that folder since its previous release, and for the app
# a link to the hand-written listeners' notes (scripts/release/notes.sh).
# On a Mac, `make release-video` attaches the narrated video and opens the notes with it, and when
# mobile/ changed `make release` in mobile/ uploads the app's builds. `make promote` then publishes
# it (not without the video); it becomes "latest" only with the app's downloads attached.
name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: The tag matches VERSION in every app
        env:
          TAG: ${{ github.ref_name }}
        run: |
          scripts/release/check-version.sh
          [ "$TAG" = "v$(cat VERSION)" ] || { echo "Tag $TAG, but VERSION is $(cat VERSION)" >&2; exit 1; }
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already has a release (the app's make publish made it first)"
            exit 0
          fi
          scripts/release/notes.sh "$TAG" > notes.md
          gh release create "$TAG" --verify-tag --prerelease --latest=false \
            --title "$TAG" --notes-file notes.md
