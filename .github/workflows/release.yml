# One version for the whole repository: pushing a vX.Y.Z tag (`make release` at the root) creates
# the GitHub release "Radio Crestin vX.Y.Z" as a prerelease. Its notes link the app's hand-written
# notes and list what changed in web/ and backend/ (scripts/release/notes.sh).
# The app's builds are made on a Mac: `make release` in mobile/ uploads them to this same release
# and rewrites its notes with the narrated video. `make promote` then publishes it; it becomes
# "latest" only with the app's downloads attached (scripts/release/promote.sh).
name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: The tag matches VERSION in every app
        env:
          TAG: ${{ github.ref_name }}
        run: |
          scripts/release/check-version.sh
          [ "$TAG" = "v$(cat VERSION)" ] || { echo "Tag $TAG, but VERSION is $(cat VERSION)" >&2; exit 1; }
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already has a release (the app's make publish made it first)"
            exit 0
          fi
          notes="mobile/release-notes/$TAG.md"
          if [ -f "$notes" ]; then
            {
              echo "## 📱 App"
              echo
              echo "What's new for listeners: [$notes](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/$notes)"
              echo
              scripts/release/notes.sh "$TAG"
            } > notes.md
          else
            scripts/release/notes.sh "$TAG" --app > notes.md
          fi
          gh release create "$TAG" --verify-tag --prerelease --latest=false \
            --title "Radio Crestin $TAG" --notes-file notes.md
